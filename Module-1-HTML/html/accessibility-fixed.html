<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Fixed Demo</title>
    <!-- Main Style Sheet Link -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <main id="main-content">
        <section class="demo-container">
            <h1>Accessible Components Demo</h1>
            
            <!-- Accessible Figure -->
            <figure class="accessible-card">
                <img src="../images/chart.png" alt="Bar chart showing 2026 accessibility compliance growth by 45%">
                <figcaption>Figure 1: Annual Accessibility Compliance Report Data.</figcaption>
            </figure>

            <!-- Accessible Form -->
            <form class="accessible-form" aria-labelledby="form-title">
                <h2 id="form-title">Feedback Form</h2>
                
                <div class="form-group">
                    <label for="user-name">Full Name <span class="required" aria-hidden="true">*</span></label>
                    <input type="text" id="user-name" name="fullname" required>
                </div>

                <div class="form-group">
                    <label for="user-email">Email Address <span class="required" aria-hidden="true">*</span></label>
                    <input type="email" id="user-email" name="email" required>
                </div>

                <button type="submit" class="btn-primary">Submit Feedback</button>
                <div role="alert" class="form-status" aria-live="polite"></div>
            </form>
        </section>
    </main>
</body>
</html>
