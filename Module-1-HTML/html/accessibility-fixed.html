<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Accessibility Fixed Page</title>

</head>


<body>


<!-- Fixed: Skip Link -->

<a href="#main-content">
    Skip to Content
</a>



<header>


<h1>
    My Website
</h1>



<!-- Fixed: Navigation Landmark -->

<nav aria-label="Main Navigation">


<a href="#">
    Home
</a>


<a href="#">
    About
</a>


</nav>


</header>




<main id="main-content">



<!-- Fixed: Correct Heading Order -->

<h2>
    Welcome Section
</h2>



<!-- Fixed: Image with Alt -->

<img 
src="image.jpg"
alt="Website homepage design example">





<!-- Fixed: Information not dependent on color -->

<p>
    Error status is marked with text:
    Error Found
</p>





<!-- Fixed: Input with Label -->

<label for="name">
    Name:
</label>

<input
type="text"
id="name"
name="name">





<br><br>




<!-- Fixed: Button instead of Div -->

<button type="button">
    Click Me
</button>





<br><br>




<!-- Fixed: Form Label -->

<form>


<label for="email">
    Email:
</label>


<input
type="email"
id="email"
name="email">



</form>





<br>



<!-- Fixed: Meaningful Link Text -->

<a href="#">
    Read About Accessibility
</a>




</main>





<footer>

<p> Copyright 2026</p>
</footer>
</body>

</html>
