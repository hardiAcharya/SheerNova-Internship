<!DOCTYPE html>
<html>

<head>

    <title>Accessibility Errors</title>

</head>


<body>


<!-- Error 1: No Skip Link -->


<header>

    <h1>
        My Website
    </h1>


    <!-- Error 2: Navigation without proper label -->

    <nav>

        <a href="#">
            Home
        </a>

        <a href="#">
            About
        </a>

    </nav>

</header>



<main>


<!-- Error 3: Wrong heading order -->

<h4>
    Welcome Section
</h4>



<!-- Error 4: Image without alt -->

<img src="image.jpg">



<!-- Error 5: Color only information -->

<p style="color:red;">
    Red means error
</p>



<!-- Error 6: Input without label -->

<input 
type="text"
placeholder="Enter Name">



<br><br>



<!-- Error 7: Div used as button -->

<div onclick="alert('Clicked')">
    Click Me
</div>



<!-- Error 8: Missing form label -->

<form>

<input type="email"
placeholder="Email">


</form>



<!-- Error 9: Poor link text -->

<a href="#">
    Click Here
</a>



<!-- Error 10: No language attribute -->

<p>
    Welcome to our website.
</p>

</main>
<footer>

    Copyright 2026

</footer>
</body>

</html>
