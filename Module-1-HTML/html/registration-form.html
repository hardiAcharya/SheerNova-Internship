<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
</head>
<body>

<header>
    <h1>User Registration Form</h1>
</header>

<main>

<form action="#" method="post">

    <!-- Personal Information -->
    <fieldset>
        <legend>Personal Information</legend>

        <label for="fname">First Name:</label><br>
        <input type="text" id="fname" name="fname" required><br><br>

        <label for="lname">Last Name:</label><br>
        <input type="text" id="lname" name="lname" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label><br>
        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}$"
            title="Minimum 8 characters, at least one uppercase letter, one lowercase letter and one number."
            required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input
            type="tel"
            id="phone"
            name="phone"
            pattern="[0-9]{10}"
            placeholder="9876543210"
            title="Enter a valid 10-digit phone number."
            required><br><br>

        <label for="age">Age:</label><br>
        <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="100"
            required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input
            type="date"
            id="dob"
            name="dob"
            max="2026-07-24"
            required>
    </fieldset>

    <br>

    <!-- Education -->
    <fieldset>
        <legend>Education Details</legend>

        <label for="course">Course:</label><br>

        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>

            <optgroup label="Computer Courses">
                <option value="BCA">BCA</option>
                <option value="BSc IT">BSc IT</option>
                <option value="MCA">MCA</option>
            </optgroup>

            <optgroup label="Management Courses">
                <option value="BBA">BBA</option>
                <option value="MBA">MBA</option>
            </optgroup>
        </select>

        <br><br>

        <label for="college">College:</label><br>

        <input
            list="colleges"
            id="college"
            name="college"
            placeholder="Choose or type your college"
            required>

        <datalist id="colleges">
            <option value="SMT S. J. Varmora College">
            <option value="Government College">
            <option value="Saurashtra University">
        </datalist>

    </fieldset>

    <br>

    <!-- Gender -->
    <fieldset>
        <legend>Gender</legend>

        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>
    </fieldset>

    <br>

    <!-- Skills -->
    <fieldset>
        <legend>Skills</legend>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label><br>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label><br>

        <input type="checkbox" id="javascript" name="skills" value="JavaScript">
        <label for="javascript">JavaScript</label><br>

        <input type="checkbox" id="sql" name="skills" value="SQL">
        <label for="sql">SQL</label>
    </fieldset>

    <br>

    <!-- Additional Information -->
    <fieldset>
        <legend>Additional Information</legend>

        <label for="photo">Upload Profile Photo:</label><br>
        <input
            type="file"
            id="photo"
            name="photo"
            accept="image/*"
            required><br><br>

        <label for="bio">About Yourself:</label><br>
        <textarea
            id="bio"
            name="bio"
            rows="5"
            cols="40"
            placeholder="Write a short introduction..."
            required></textarea>
    </fieldset>

    <br>

    <input type="submit" value="Register">
    <input type="reset" value="Reset">

</form>

</main>

<footer>
    <p>&copy; 2026 User Registration Form</p>
</footer>

</body>
</html>
