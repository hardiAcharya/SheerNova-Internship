<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Page</title>
</head>
<body>

<header>
    <h1>Media Page</h1>
</header>

<main>

    <h2>Video</h2>
        <video controls width="500" poster="../images/media/poster.jpg">
        <source src="../media/sample_video-1.mp4" type="video/mp4">
        Your browser does not support the video tag.

    </video>

    <hr>
    <h2>Audio</h2>
        <audio controls>
            <source src="../media/Ganga_Ke_Kinare.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
    </audio>

    <hr>

    <h2>Responsive Picture</h2>

    <picture>

    <img src="../images/media/nature.jpg" alt="Nature Image" width="500" loading="lazy">

</picture>

    <hr>

    <h2>Image Gallery</h2>

    <img src="../images/media/small.jpg" alt="Image 1" loading="lazy" width="300">

    <img src="../images/media/medium.jpg" alt="Image 2" loading="lazy" width="300">

    <img src="../images/media/large.jpg" alt="Image 3" loading="lazy" width="300">

    <hr>

    <h2>Google Map</h2>

    <iframe
        src="https://www.google.com/maps?q=Surendranagar&output=embed"
        width="500"
        height="300"
        loading="lazy">
    </iframe>

</main>

<footer>
    <p>&copy; 2026 Media Page</p>
</footer>

</body>
</html>
