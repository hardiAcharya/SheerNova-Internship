<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Checkout</title>
<link rel="stylesheet" href="../css/new-style.css">
</head>
<body>

<header>
<h1>Checkout Form</h1>
</header>

<main>
<form>
<fieldset>
<legend>Delivery</legend>

<label for="name">Name:
<input type="text" id="name" name="name" autocomplete="name" required>
</label>

<label for="email">Email:
<input type="email" id="email" name="email" autocomplete="email" required>
</label>

<label for="phone">Phone:
<input type="tel" id="phone" name="phone" autocomplete="tel" required>
</label>

<label for="address">Address:
<input type="text" id="address" name="address" autocomplete="address-line1" required>
</label>

<label for="city">City:
<input type="text" id="city" name="city" autocomplete="address-level2" required>
</label>

<label for="postal">Postal Code:
<input type="text" id="postal" name="postal" autocomplete="postal-code" required>
</label>
</fieldset>

<fieldset>
<legend>Payment</legend>

<label for="ccname">Card Name:
<input type="text" id="ccname" name="ccname" autocomplete="cc-name" required>
</label>

<label for="ccnumber">Card Number:
<input type="text" id="ccnumber" name="ccnumber" autocomplete="cc-number" inputmode="numeric" maxlength="19" required>
</label>

<label for="ccexp">Expiry:
<input type="month" id="ccexp" name="ccexp" autocomplete="cc-exp" required>
</label>

<label for="cvv">CVV:
<input type="password" id="cvv" name="cvv" autocomplete="cc-csc" maxlength="4" required>
</label>
</fieldset>

<fieldset>
<legend>Confirmation</legend>

<label for="notes">Order Notes:
<textarea id="notes" name="notes" placeholder="Any special instructions"></textarea>
</label>

<label for="terms">
<input type="checkbox" id="terms" name="terms" required>
Accept Terms and Conditions
</label>

<button type="submit">Place Order</button>
</fieldset>
</form>
</main>

<footer>
<p>&copy; 2026 Checkout</p>
</footer>

</body>
</html>
