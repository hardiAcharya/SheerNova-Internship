<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 04 - Box Model Lab</title>
  <link rel="stylesheet" href="box-model.css">
</head>
<body>
  <div class="container">
    <h2>CSS Box Model Comparison</h2>
    
    <div class="box content-box">
      <h3>content-box</h3>
      <p>Width: 300px + Padding: 40px + Border: 10px = <b>350px Total Width</b></p>
    </div>

    <div class="box border-box">
      <h3>border-box</h3>
      <p>Width: 300px (Includes Padding & Border) = <b>300px Total Width</b></p>
    </div>
  </div>
</body>
</html>
