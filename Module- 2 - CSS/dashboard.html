<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module 2 - Grid Dashboard</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>

  <!-- Dashboard CSS Grid Template Areas Layout (Task 15) -->
  <div class="dashboard-layout">
    
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <h2 class="sidebar__title">DashApp</h2>
      <nav>
        <ul class="sidebar__list">
          <li class="sidebar__item"><a href="index.html" class="navbar__link">← Main Website</a></li>
          <li class="sidebar__item"><a href="dashboard.html" class="navbar__link navbar__link--active">Analytics</a></li>
          <li class="sidebar__item"><a href="#" class="navbar__link">Settings</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Header -->
    <header class="dashboard-header">
      <h2>Analytics Overview</h2>
      <div class="user-profile">
        <div class="spinner"></div>
        <span>User Admin</span>
      </div>
    </header>

    <!-- Main Grid Workspace -->
    <main class="dashboard-main">
      
      <!-- Stats Summary Cards Grid -->
      <div class="stats-grid">
        <div class="card stat-card">
          <small class="stat-card__label">Total Visitors</small>
          <h3 class="stat-card__value">24,500</h3>
        </div>
        <div class="card stat-card">
          <small class="stat-card__label">Conversion Rate</small>
          <h3 class="stat-card__value stat-card__value--success">4.8%</h3>
        </div>
        <div class="card stat-card">
          <small class="stat-card__label">Active Sessions</small>
          <h3 class="stat-card__value stat-card__value--primary">1,210</h3>
        </div>
      </div>

      <!-- Media Gallery Grid -->
      <h3 class="gallery-title">Media Gallery Grid</h3>
      <div class="masonry-grid">
        <!-- Gallery Image 1 (Tall / Vertical) -->
        <div class="card masonry-tile masonry-tile--tall">
          <img src="./assets/images/dashboard_image1.png" alt="Gallery Portrait Image 1" class="gallery-img">
        </div>

        <!-- Gallery Image 2 -->
        <div class="card masonry-tile">
          <img src="./assets/images/dashboard_image2.jpg" alt="Gallery Landscape Image 2" class="gallery-img">
        </div>

        <!-- Gallery Image 3 -->
        <div class="card masonry-tile">
          <img src="./assets/images/dashboard_image3.jpg" alt="Gallery Landscape Image 3" class="gallery-img">
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="dashboard-footer">
      <p>Dashboard Panel &copy; 2026 Admin Hub</p>
    </footer>

  </div>

</body>
</html>
